on:
  workflow_dispatch: 

jobs: 
  agent-task: 
    runs-on: ubuntu-latest
    steps:
      - name: Branch Checkout
        uses: actions/checkout@v4
      
      - name: Setup GitHub Copilot CLI
        run: |
          npm install -g @github/copilot
        env:
          COPILOT_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Agent Task - Summarize recent changes
        run: |
           copilot -p "Summarize recent changes in this repository" --no-ask-user
      
      - name: Agent Task - Review for vulnerabilities
        run: |
          copilot -p "Review code and dependencies for vulnerabilities and create issue" --no-ask-user
